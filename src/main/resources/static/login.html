<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Care - Sign In</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --secondary: #475569;
            --success: #059669;
            --light: #f8fafc;
            --dark: #1e293b;
            --border: #e2e8f0;
        }
        * { box-sizing: border-box; }
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 50%, #06b6d4 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }
        .login-card {
            width: 100%;
            max-width: 420px;
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25);
            overflow: hidden;
        }
        .login-header {
            background: linear-gradient(135deg, var(--primary) 0%, #3b82f6 100%);
            color: #fff;
            padding: 2.5rem 2rem 2rem;
            text-align: center;
        }
        .login-header .brand-icon {
            width: 64px;
            height: 64px;
            background: rgba(255,255,255,0.2);
            border-radius: 16px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 1rem;
            font-size: 1.75rem;
        }
        .login-header h1 { font-size: 1.5rem; font-weight: 700; margin: 0; }
        .login-header p { margin: 0.5rem 0 0; opacity: 0.9; font-size: 0.95rem; }
        .login-body { padding: 2rem; }
        .form-label { font-weight: 500; color: var(--dark); margin-bottom: 0.5rem; font-size: 0.875rem; }
        .form-control {
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 0.75rem 1rem;
            font-size: 1rem;
            transition: all 0.15s ease;
        }
        .form-control:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
        }
        .input-group { position: relative; }
        .input-group .form-control { padding-right: 3rem; }
        .toggle-password {
            position: absolute;
            right: 0.75rem;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #94a3b8;
            cursor: pointer;
            padding: 0.25rem;
            font-size: 1.1rem;
            transition: color 0.15s;
        }
        .toggle-password:hover { color: var(--primary); }
        .form-check { margin: 1rem 0 1.5rem; }
        .form-check-input { width: 1.125rem; height: 1.125rem; border-radius: 4px; border-color: var(--border); }
        .form-check-input:checked { background: var(--primary); border-color: var(--primary); }
        .form-check-label { font-size: 0.875rem; color: var(--secondary); cursor: pointer; }
        .btn-login {
            width: 100%;
            padding: 0.875rem;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 10px;
            background: var(--primary);
            border: none;
            color: #fff;
            transition: all 0.15s ease;
        }
        .btn-login:hover { background: var(--primary-hover); transform: translateY(-1px); box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3); }
        .btn-login:active { transform: translateY(0); }
        .btn-login:disabled { opacity: 0.7; cursor: not-allowed; transform: none; }
        .alert { border-radius: 10px; border: none; padding: 0.875rem 1rem; font-size: 0.875rem; }
        .alert-danger { background: #fef2f2; color: #dc2626; }
        .login-footer { text-align: center; padding: 1.5rem 2rem 2rem; background: var(--light); border-top: 1px solid var(--border); }
        .login-footer a { color: var(--primary); text-decoration: none; font-weight: 500; font-size: 0.9rem; }
        .login-footer a:hover { text-decoration: underline; }
        .demo-credentials { margin-top: 1.5rem; padding: 1rem; background: #f0f9ff; border-radius: 10px; border: 1px solid #bae6fd; font-size: 0.8rem; color: #0369a1; }
        .demo-credentials summary { cursor: pointer; font-weight: 600; margin-bottom: 0.5rem; }
        .demo-credentials p { margin: 0.25rem 0; font-family: monospace; }
    </style>
</head>
<body>
<div class="login-card">
    <div class="login-header">
        <div class="brand-icon"><i class="bi bi-hospital"></i></div>
        <h1>Campus Care</h1>
        <p>Student Service Request & Complaint Management</p>
    </div>

    <div class="login-body">
        <div id="errorAlert" class="alert alert-danger d-none" role="alert"></div>

        <form id="loginForm" novalidate>
            <div class="mb-3">
                <label class="form-label" for="email">Email Address</label>
                <input type="email" id="email" class="form-control" placeholder="student@campus.example" required autocomplete="email" autofocus>
            </div>

            <div class="mb-3">
                <label class="form-label" for="password">Password</label>
                <div class="input-group">
                    <input type="password" id="password" class="form-control" placeholder="Enter password" required autocomplete="current-password">
                    <button type="button" class="toggle-password" id="togglePassword" aria-label="Show password">
                        <i class="bi bi-eye" id="toggleIcon"></i>
                    </button>
                </div>
            </div>

            <div class="form-check">
                <input type="checkbox" class="form-check-input" id="remember">
                <label class="form-check-label" for="remember">Remember me</label>
            </div>

            <button type="submit" class="btn-login" id="loginBtn">
                <span class="btn-text"><i class="bi bi-box-arrow-in-right me-2"></i> Sign In</span>
                <span class="btn-loading d-none"><i class="bi bi-arrow-clockwise spin me-2"></i> Signing in...</span>
            </button>
        </form>
    </div>

    <div class="login-footer">
        <p class="mb-0">Don't have an account? <a href="register.html">Register</a></p>

        <details class="demo-credentials">
            <summary>Demo Credentials (password: password123)</summary>
            <p>Student: student@campus.example</p>
            <p>Admin: admin@campus.example</p>
            <p>Staff: staff@campus.example</p>
        </details>
    </div>
</div>

<style>
    .spin { animation: spin 1s linear infinite; }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
</style>

<script>
    const toggleBtn = document.getElementById('togglePassword');
    const toggleIcon = document.getElementById('toggleIcon');
    const passwordInput = document.getElementById('password');

    toggleBtn.addEventListener('click', () => {
        const type = passwordInput.type === 'password' ? 'text' : 'password';
        passwordInput.type = type;
        toggleIcon.classList.toggle('bi-eye');
        toggleIcon.classList.toggle('bi-eye-slash');
    });

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('loginBtn');
        const btnText = btn.querySelector('.btn-text');
        const btnLoading = btn.querySelector('.btn-loading');
        const errorAlert = document.getElementById('errorAlert');

        btn.disabled = true;
        btnText.classList.add('d-none');
        btnLoading.classList.remove('d-none');
        errorAlert.classList.add('d-none');

        const payload = {
            email: document.getElementById('email').value.trim(),
            password: document.getElementById('password').value
        };

        try {
            const res = await fetch('/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            const data = await res.json();

            if (!res.ok) {
                throw new Error(data.error || 'Login failed');
            }

            localStorage.setItem('accessToken', data.accessToken);
            localStorage.setItem('refreshToken', data.refreshToken);
            localStorage.setItem('user', JSON.stringify(data));

            // Redirect based on role
            const redirect = data.role === 'STUDENT' ? 'dashboard.html' : 'admin-dashboard.html';
            window.location.href = redirect;

        } catch (err) {
            errorAlert.textContent = err.message;
            errorAlert.classList.remove('d-none');
            btn.disabled = false;
            btnText.classList.remove('d-none');
            btnLoading.classList.add('d-none');
        }
    });
</script>
</body>
</html>
