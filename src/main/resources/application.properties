spring.application.name=campuscare
spring.profiles.active=dev
spring.jpa.hibernate.ddl-auto=create
spring.flyway.enabled=false
spring.jpa.defer-datasource-initialization=true

# H2 In-Memory Database (no external DB needed)
spring.datasource.url=jdbc:h2:mem:campuscare;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# H2 Console at http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Initialize data.sql after tables created
spring.sql.init.mode=always

# JWT Configuration (valid base64)
app.jwt.secret=ZGV2LXNlY3JldC1rZXktZm9yLWRldmVsb3BtZW50LW9ubHktbWFrZS1pdC1sb25nLWVub3VnaC1mb3ItaG1hYy1zaGEyNTY=
app.jwt.expiration=86400000
app.jwt.refresh-expiration=604800000

# Server
server.port=8080