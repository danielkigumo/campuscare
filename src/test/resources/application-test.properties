# Test Profile Configuration for H2 In-Memory Database
spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false

# H2 In-Memory Database for Testing
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# H2 Console for debugging
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JWT Configuration (shorter for tests)
app.jwt.secret=test-secret-key-for-testing-only-make-it-long-enough-for-hmac-sha256
app.jwt.expiration=3600000
app.jwt.refresh-expiration=7200000

# Server
server.port=0